name: Backup freshness

# Nightly backups fail silently by nature: cron reports to nobody, and a bucket that stops
# receiving objects looks exactly like a bucket nobody has looked at. A backup step that was
# documented but never installed is indistinguishable, for months, from one running every night.
#
# This job is the alarm for that. It asks one question - is the newest backup recent - and it
# reports by two routes with opposite failure modes: a heartbeat that must keep arriving, so the
# job dying is itself detectable, and an issue that stays open until the problem is fixed.
#
# It reads object names and creation times only. Listing needs no permission to read a backup, so
# the append-only posture described in deploy/README.md survives untouched: nothing here, and no
# credential here, can fetch a dump.

on:
  schedule:
    # 09:43 UTC, hours after the 02:17 backup. The gap is deliberate: checking straight after the
    # window would leave a single missed night inside the freshness threshold and therefore silent.
    #
    # The odd minute is deliberate too. GitHub queues scheduled workflows rather than guaranteeing
    # them, and names the top of the hour as its heaviest load, where runs are delayed and can be
    # dropped altogether. A round time is the one thing a daily check cannot afford, since a job
    # that silently does not run is indistinguishable from a job that ran and found nothing wrong.
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Raise an alert that does not depend on anyone remembering to look at a dashboard.
  issues: write
  # Mint the OIDC token exchanged for short-lived cloud credentials. No long-lived key exists.
  id-token: write

concurrency:
  group: backup-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: newest backup is recent
    # Only the canonical repository watches the hosted instance. A fork has no bucket, no identity
    # binding and no business opening issues here.
    if: github.repository == 'getsotto/sotto'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether monitoring is configured
        id: config
        env:
          # The same destination the host already writes to, named and spelled the same way, so
          # there is one bucket setting in this project rather than two that can disagree.
          DESTINATION: ${{ vars.SOTTO_BACKUP_BUCKET }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_MONITOR_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          # Skip rather than fail when unconfigured, so adding this workflow cannot turn a healthy
          # repository red before the one-time cloud setup has been done.
          if [ -z "$DESTINATION" ] || [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Backup monitoring is not configured; see deploy/README.md section Backups." >&2
            exit 0
          fi

          # backup.sh uploads to any of gs://, s3:// and rclone remotes. This workflow implements
          # the gs:// case only, so say so plainly rather than failing later with something that
          # reads like a bug. The check itself is three lines of shell against any store, and the
          # runbook shows it; nobody should conclude their storage is unsupported.
          case "$DESTINATION" in
            gs://*)
              echo "configured=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "This workflow checks gs:// destinations. For ${DESTINATION%%:*}, run the equivalent check from any scheduler; see deploy/README.md section Backups." >&2
              ;;
          esac

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MONITOR_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Measure the age of the newest backup
        id: check
        if: steps.config.outputs.configured == 'true'
        env:
          DESTINATION: ${{ vars.SOTTO_BACKUP_BUCKET }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          # One missed night must breach this, so it has to exceed the interval between the backup
          # and this check plus a full day. Deliberately a constant: the figure is derived from the
          # schedule above, and a deployment that changes the schedule should change both together
          # rather than tune a threshold until the alarm stops complaining.
          MAX_AGE_HOURS: "26"
        run: |
          set -euo pipefail

          # backup.sh dispatches on the destination scheme; read the same setting the same way so
          # the two cannot drift.
          bucket="${DESTINATION#gs://}"
          bucket="${bucket%%/*}"

          # Refuse anything that is not a plain bucket name before it reaches a URL path. Bucket
          # names cannot contain these characters, so a value that does is a misconfiguration, and
          # interpolating it unchecked would be the beginnings of a request forgery.
          case "$bucket" in
            "" | *[!a-z0-9._-]*)
              echo "SOTTO_BACKUP_BUCKET does not name a usable bucket: ${DESTINATION}" >&2
              exit 1
              ;;
          esac

          # The JSON API rather than a CLI: no tool to install, and a stable contract to parse.
          # `fields` keeps the response to what is asked, so no backup content is requested even
          # accidentally. A 30-day lifecycle keeps the object count far below one page.
          response="$(curl -fsS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://storage.googleapis.com/storage/v1/b/${bucket}/o?fields=items(name,timeCreated)")"

          newest="$(printf '%s' "$response" | jq -r '[.items[]?.timeCreated] | max // empty')"
          if [ -z "$newest" ]; then
            echo "reason=The backup bucket is empty. No dump has ever been uploaded, or the lifecycle rule has deleted them all." >> "$GITHUB_OUTPUT"
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age_seconds=$(( $(date -u +%s) - $(date -u -d "$newest" +%s) ))
          age_hours=$(( age_seconds / 3600 ))
          echo "Newest backup: ${newest} (${age_hours}h old, threshold ${MAX_AGE_HOURS}h)"

          if [ "$age_hours" -ge "$MAX_AGE_HOURS" ]; then
            echo "reason=The newest backup is ${age_hours} hours old, past the ${MAX_AGE_HOURS} hour threshold. The most recent upload was ${newest}. On the host, check the cron entry and the last \`backup started\`, \`backup ok\` and \`backup FAILED\` lines in \$HOME/sotto-backup.log; deploy/README.md section Backups, step 6, has the triage." >> "$GITHUB_OUTPUT"
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the heartbeat
        # Only on success, and only when a heartbeat is configured. Whichever external checker owns
        # that URL alerts when these stop arriving, which is what catches this workflow being
        # disabled, throttled or quietly broken - the failure mode an alert-on-error design cannot
        # see.
        if: steps.config.outputs.configured == 'true' && steps.check.outputs.healthy == 'true'
        env:
          HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          set -euo pipefail
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS --retry 3 --max-time 30 "$HEARTBEAT_URL" > /dev/null
          fi

      - name: Open or update the alert
        if: steps.config.outputs.configured == 'true' && steps.check.outputs.healthy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh resolves the repository from a git remote and ignores GITHUB_REPOSITORY. This job
          # deliberately does not check out the tree, so without GH_REPO every gh call fails and
          # takes the step with it under set -e, silently disabling the alert.
          GH_REPO: ${{ github.repository }}
          TITLE: "Backups are stale"
          LABEL: backup-alert
          REASON: ${{ steps.check.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Identify our own alert by label, not by title. Title search is token-based, so a human
          # issue mentioning stale backups would be adopted, commented on, and later closed by this
          # workflow. A label is exact and only this job applies it. --force makes creating it
          # idempotent, so the workflow carries its own dependency rather than assuming setup.
          gh label create "$LABEL" --force \
            --color B60205 --description "Raised automatically when backups stop arriving"

          existing="$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')"
          body="$(printf '%s\n\nChecked by [this run](%s).' "$REASON" "$RUN_URL")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
          exit 1

      - name: Close a resolved alert
        # Recovering silently would leave a stale issue implying an outage that has ended, which
        # trains you to ignore the alert that matters.
        if: steps.config.outputs.configured == 'true' && steps.check.outputs.healthy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh resolves the repository from a git remote and ignores GITHUB_REPOSITORY. This job
          # deliberately does not check out the tree, so without GH_REPO every gh call fails and
          # takes the step with it under set -e, silently disabling the alert.
          GH_REPO: ${{ github.repository }}
          LABEL: backup-alert
        run: |
          set -euo pipefail
          # Close every open alert, not just the newest. Taking only the first would leave any
          # duplicate open for ever, still claiming an outage that ended. Tolerate the label not
          # existing yet: on a healthy instance nothing has ever created it, and a healthy day must
          # never fail this job.
          open_alerts="$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[].number' 2>/dev/null || true)"
          for number in $open_alerts; do
            gh issue close "$number" --comment "Backups are fresh again."
          done
