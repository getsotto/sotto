name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  action-consumer:
    name: action consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Keep the consumer check on the newest published CLI release; update this after each release.
      SOTTO_TEST_VERSION: v0.4.0
    steps:
      - uses: actions/checkout@v4
      # Exercise the moving major tag after the release workflow validates it.
      - id: sotto
        name: Install Sotto action
        uses: getsotto/sotto-action@v1
        with:
          sotto-version: ${{ env.SOTTO_TEST_VERSION }}
      - id: missing-version
        name: Reject missing sotto-version
        uses: getsotto/sotto-action@v1
        continue-on-error: true
      - name: Verify missing version is rejected (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: test "${{ steps.missing-version.outcome }}" = failure
      - name: Verify missing version is rejected (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ('${{ steps.missing-version.outcome }}' -ne 'failure') {
            throw "missing sotto-version was accepted"
          }
      - name: Verify installed release (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          OUTPUT_VERSION: ${{ steps.sotto.outputs.version }}
          OUTPUT_TARGET: ${{ steps.sotto.outputs.target }}
          OUTPUT_BINARY_PATH: ${{ steps.sotto.outputs.binary-path }}
        run: |
          actual="$(sotto --version)"
          expected="sotto ${SOTTO_TEST_VERSION#v}"
          test "$actual" = "$expected"
          test "$OUTPUT_VERSION" = "$SOTTO_TEST_VERSION"
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) expected_target=x86_64-unknown-linux-gnu ;;
            Linux:aarch64|Linux:arm64) expected_target=aarch64-unknown-linux-gnu ;;
            Darwin:x86_64) expected_target=x86_64-apple-darwin ;;
            Darwin:arm64) expected_target=aarch64-apple-darwin ;;
            *) echo "error: unsupported runner $(uname -s):$(uname -m)" >&2; exit 1 ;;
          esac
          test "$OUTPUT_TARGET" = "$expected_target"
          test -x "$OUTPUT_BINARY_PATH"
      - name: Verify installed release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OUTPUT_VERSION: ${{ steps.sotto.outputs.version }}
          OUTPUT_TARGET: ${{ steps.sotto.outputs.target }}
          OUTPUT_BINARY_PATH: ${{ steps.sotto.outputs.binary-path }}
        run: |
          $actual = (& sotto --version).Trim()
          $expected = "sotto $($env:SOTTO_TEST_VERSION.Substring(1))"
          if ($actual -ne $expected) { throw "expected '$actual' to equal '$expected'" }
          if ($env:OUTPUT_VERSION -ne $env:SOTTO_TEST_VERSION) { throw "unexpected action version output" }
          $expectedTarget = switch ($env:PROCESSOR_ARCHITECTURE) {
            AMD64 { "x86_64-pc-windows-msvc" }
            default { throw "unsupported Windows architecture: $env:PROCESSOR_ARCHITECTURE" }
          }
          if ($env:OUTPUT_TARGET -ne $expectedTarget) { throw "unexpected action target output" }
          if (-not (Test-Path -LiteralPath $env:OUTPUT_BINARY_PATH -PathType Leaf)) {
            throw "installed binary was not found"
          }

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # Pinned: the action's "latest" resolution isn't reliably semver-aware - it picked
        # v0.9.1 over the real latest (v0.15.0) on a run during this same session, which reads
        # like a lexicographic string comparison bug ("9" > "1" as characters), not a semver one.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Build WASM core
        run: cargo build -p sotto-wasm --target wasm32-unknown-unknown
      - name: Cross-impl gate (native-produced vectors decrypt in WASM)
        run: wasm-pack test --node crates/wasm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # Pinned: the action's "latest" resolution isn't reliably semver-aware - it picked
        # v0.9.1 over the real latest (v0.15.0) on a run during this same session, which reads
        # like a lexicographic string comparison bug ("9" > "1" as characters), not a semver one.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Dependency audit (shipped deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Generate WASM bindings
        run: npm run build:wasm
      - name: Typecheck
        run: npm run typecheck
      - name: Build (vite bundle)
        run: npx vite build
      - name: WASM smoke (crypto core loads)
        run: npm run smoke

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sotto
          POSTGRES_PASSWORD: sotto
          POSTGRES_DB: sotto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sotto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sotto:sotto@localhost:5432/sotto
      SOTTO_RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Server + end-to-end tests (with Postgres)
        run: cargo test -p sotto-server -p sotto-cli

  funnel-e2e:
    name: funnel regression suite (Launch gate 4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sotto
          POSTGRES_PASSWORD: sotto
          POSTGRES_DB: sotto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sotto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sotto:sotto@localhost:5432/sotto
      # The Playwright config supplies non-secret values so the feature-gated local billing adapter
      # is enabled. It never calls Stripe and keeps this required gate safe for forked pull requests.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # Pinned: the action's "latest" resolution isn't reliably semver-aware - it picked
        # v0.9.1 over the real latest (v0.15.0) on a run during this same session, which reads
        # like a lexicographic string comparison bug ("9" > "1" as characters), not a semver one.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the mock-OAuth server and the seed fixture
        run: |
          cargo build -p sotto-server --features e2e-mock-oauth,e2e-mock-billing
          cargo build -p sotto-cli --example e2e_seed

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Playwright's chromium browser
        working-directory: web
        # ubuntu-latest already includes Chromium and its system libraries. Avoid --with-deps here
        # because its apt transaction has previously hung before this required gate could start.
        run: |
          timeout --kill-after=30s 5m npx playwright install chromium || {
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "::error::Playwright Chromium install exceeded five minutes"
            fi
            exit "$status"
          }

      - name: Funnel regression suite
        working-directory: web
        run: npm run e2e

      # Keep this paired with the JSON reporter in web/playwright.config.ts. A skipped test must
      # not make the required browser gate look green.
      - name: Reject skipped funnel tests
        working-directory: web
        run: |
          node -e 'const report = require("./test-results/playwright.json"); const skipped = report.stats?.skipped ?? 0; if (skipped !== 0) { console.error(`funnel suite skipped ${skipped} test(s)`); process.exit(1); }'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results has the raw trace.zip/screenshots (trace: "retain-on-failure"), not just
          # the html report shell - without it a failure is much harder to actually debug.
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        # Keep the JSON report parser/tests in sync when upgrading this version.
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Test cargo audit policy
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Audit lockfile and verify dormant exceptions
        run: scripts/check-cargo-audit
      - name: cargo-deny (advisories, bans, licences, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
