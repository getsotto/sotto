# Prebuilt Docker images: build the server and web (Caddy + SPA) images for amd64 + arm64 and
# publish them to GHCR, so a deployment box only pulls - it never needs the RAM or toolchain to
# compile Rust/WASM from source (a 1 GB free-tier VM can host Sotto).
#
# Runs on release tags (published as :vX.Y.Z and :latest) and manually via workflow_dispatch
# (published as :latest from the chosen ref). Each architecture builds NATIVELY (GitHub's arm64
# runners) - no QEMU emulation, which would make the Rust release build take hours - then a
# multi-arch manifest stitches the two together.

name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { image: sotto-server, dockerfile: Dockerfile, arch: amd64, os: ubuntu-latest }
          - { image: sotto-server, dockerfile: Dockerfile, arch: arm64, os: ubuntu-24.04-arm }
          - { image: sotto-web, dockerfile: deploy/Dockerfile.web, arch: amd64, os: ubuntu-latest }
          - { image: sotto-web, dockerfile: deploy/Dockerfile.web, arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push a per-arch staging tag; the merge job below combines them and applies the real tags.
      - name: Collect the web build arguments
        id: buildargs
        env:
          SOTTO_PUBLIC_URL: ${{ vars.SOTTO_PUBLIC_URL }}
          VITE_STATUS_URL: ${{ vars.VITE_STATUS_URL }}
          VITE_ORGANISATION_DELETION_ENABLED: ${{ vars.VITE_ORGANISATION_DELETION_ENABLED }}
        run: |
          set -euo pipefail
          # deploy/Dockerfile.web has declared these since the deletion flag needed the first
          # one, and nothing ever passed them, so every published image has silently taken the
          # defaults and the only way to change one was to build on the host.
          #
          # Only the variables that are actually set are passed. Docker's own documentation does
          # not say whether `--build-arg FOO=` leaves the ARG default alone or overwrites it with
          # an empty string, and the difference matters: SOTTO_PUBLIC_URL empty fails the build
          # outright, because web/vite.config.ts validates it as an origin. Omitting an unset
          # variable makes the question moot rather than betting on the answer.
          {
            echo "args<<BUILD_ARGS_EOF"
            for name in SOTTO_PUBLIC_URL VITE_STATUS_URL VITE_ORGANISATION_DELETION_ENABLED; do
              value="${!name}"
              if [ -n "$value" ]; then
                echo "${name}=${value}"
              fi
            done
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.buildargs.outputs.args }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:stage-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

  publish:
    name: publish multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          set -euo pipefail
          for image in sotto-server sotto-web; do
            base="ghcr.io/${{ github.repository_owner }}/$image"
            tags=(-t "$base:latest")
            case "${{ github.ref }}" in
              refs/tags/v*) tags+=(-t "$base:${{ github.ref_name }}") ;;
            esac
            docker buildx imagetools create "${tags[@]}" \
              "$base:stage-${{ github.run_id }}-amd64" \
              "$base:stage-${{ github.run_id }}-arm64"
            docker buildx imagetools inspect "$base:latest"
          done
