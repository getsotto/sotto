# Tag-triggered releases: build the `sotto` CLI for macOS + Linux + Windows, package archives
# (tarballs everywhere except Windows, which gets a .zip) with shell completions and the threat
# model, publish SHA256SUMS, and sign every artefact with Sigstore cosign - *keyless*, via this
# workflow's GitHub OIDC identity, so there is no signing key to store, leak, or rotate.
# Verification instructions live in SECURITY.md.
#
# Apple notarisation is a documented roadmap item (it needs a paid Developer ID certificate).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  # Publish the GitHub release.
  contents: write
  # Mint the OIDC token cosign exchanges for a short-lived signing certificate.
  id-token: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A tag can point anywhere; never ship untested code. (DB-gated tests skip without Postgres.)
      - name: Test before shipping
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p sotto-cli --target ${{ matrix.target }}

      - name: Package
        # bash everywhere, including windows-latest (Git Bash) - one script, not a second dialect
        # for the Windows leg.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
          *windows*) EXT=".exe" ;;
          *) EXT="" ;;
          esac
          BIN="target/${{ matrix.target }}/release/sotto$EXT"
          STAGE=sotto-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$STAGE/completions"
          cp "$BIN" "$STAGE/"
          cp LICENSE THREAT-MODEL.md SECURITY.md "$STAGE/"
          for shell in bash zsh fish; do
            "$BIN" completions "$shell" > "$STAGE/completions/sotto.$shell"
          done
          "$BIN" completions powershell > "$STAGE/completions/sotto.ps1"
          case "${{ matrix.target }}" in
          *windows*) 7z a "$STAGE.zip" "$STAGE" >/dev/null ;;
          *) tar -czf "$STAGE.tar.gz" "$STAGE" ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sotto-${{ matrix.target }}
          path: |
            sotto-*.tar.gz
            sotto-*.zip
          if-no-files-found: error

  release:
    name: sign + publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum sotto-*.tar.gz sotto-*.zip > SHA256SUMS

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Keyless: cosign exchanges this job's OIDC token for a short-lived certificate binding the
      # signature to THIS workflow in THIS repository - verifiers pin that identity, not a key.
      - name: Sign artefacts
        run: |
          set -euo pipefail
          for f in sotto-*.tar.gz sotto-*.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "sotto ${{ github.ref_name }}" \
            --generate-notes \
            sotto-*.tar.gz sotto-*.zip SHA256SUMS ./*.sigstore.json
