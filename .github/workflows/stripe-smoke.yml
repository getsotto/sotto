name: Stripe smoke

on:
  # Weekly, because dispatch-only meant it last ran on 4 August and five weeks of drift arrived
  # at once: by the time anyone looked, Stripe had changed the account API version, Link had
  # learned the test email, and a live billing defect had been sitting unnoticed for twelve days.
  # None of those was caused by a change in this repository, which is exactly why a check that
  # only runs when someone remembers is not a check.
  #
  # Tuesday rather than Monday, and an odd minute, for the same reason every other schedule here
  # avoids round times: GitHub queues scheduled workflows and the popular slots are the slowest.
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A Stripe test account is still a credentialed external system. Serialise runs so cleanup and
# webhook delivery cannot race another checkout, and keep this workflow out of pull-request CI.
concurrency:
  group: stripe-smoke
  cancel-in-progress: false

jobs:
  stripe-smoke:
    name: stripe test-mode smoke
    permissions:
      contents: read
      # Raise an alert that outlives the run. Dispatched by hand, a failure was seen by whoever
      # pressed the button; on a schedule there is nobody watching, and a red tick in a list is
      # not a notification.
      issues: write
    # Only the canonical repository main branch may use the credentialed environment. This keeps
    # fork and pull-request workflow runs from reaching the Stripe test account.
    if: github.repository == 'getsotto/sotto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment scopes the Stripe credentials to this job rather than exposing them
    # repository-wide. It used to carry a required-reviewers rule as a second gate, which was
    # removed when this workflow went on a schedule: the two cannot coexist. A scheduled run does
    # not bypass an approval, it queues behind one, and an unapproved run is cancelled rather than
    # failed, so it would never have reached the alert below. A weekly check that reports nothing
    # when it does not run is worse than no check, because it looks like one.
    #
    # What still gates the credentials is the condition above. A run must be on main of the
    # canonical repository to reach this job at all, so anyone who could have got past the
    # reviewer rule already had write access to the default branch, and could have removed the
    # rule as easily as satisfied it. The key is test-mode.
    environment:
      name: stripe-smoke
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sotto
          POSTGRES_PASSWORD: sotto
          POSTGRES_DB: sotto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sotto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sotto:sotto@localhost:5432/sotto
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
      SOTTO_BIND: 127.0.0.1:8099
      SOTTO_PUBLIC_URL: http://127.0.0.1:8099
      SOTTO_WEB_ORIGIN: http://127.0.0.1:5199
      SOTTO_TELEMETRY: off
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The web build invokes wasm-pack directly, so install the same pinned tool used by the
      # required web CI job instead of relying on runner-global tooling. Pinning matters because
      # the action's "latest" resolution has selected v0.9.1 over v0.15.0 lexicographically.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Stripe CLI
        env:
          STRIPE_CLI_BIN_DIR: ${{ runner.temp }}/stripe-cli
        run: |
          set -euo pipefail
          ./.github/scripts/install-stripe-cli.sh
          echo "$STRIPE_CLI_BIN_DIR" >> "$GITHUB_PATH"

      - name: Validate test-mode billing configuration
        run: |
          set -euo pipefail
          case "$STRIPE_API_KEY" in
            rk_test_*) ;;
            *) echo "error: STRIPE_API_KEY must be a restricted Stripe test-mode key" >&2; exit 1 ;;
          esac
          test -n "$STRIPE_PRICE_ID"

      - name: Build the seed fixture
        run: |
          set -euo pipefail
          cargo build -p sotto-cli --example e2e_seed

      - name: Build the smoke server
        run: |
          set -euo pipefail
          cargo build -p sotto-server --features e2e-mock-oauth

      - name: Build the web app
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install Playwright's chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run real Stripe Checkout smoke
        id: checkout_flow
        working-directory: web
        run: |
          set -euo pipefail
          listener_log="$RUNNER_TEMP/stripe-listen.log"
          # `stripe listen` renders events at the account's default API version and offers no
          # way to choose one, so what arrives here is whatever the Dashboard is set to. This
          # comment used to claim the account was pinned to match the server, which stopped
          # being true without anything noticing; the server now accepts a set of versions
          # instead of depending on that. The restricted key must not read webhook endpoint
          # settings.
          stripe listen \
            --api-key "$STRIPE_API_KEY" \
            --events checkout.session.completed,customer.subscription.updated,customer.subscription.deleted \
            --forward-to "http://127.0.0.1:8099/billing/webhook" \
            >"$listener_log" 2>&1 &
          listener_pid=$!

          cleanup() {
            local status=$?
            # On the way out of a failed run, say what the webhook actually did. Without this a
            # failure at the entitlement step is indistinguishable between three causes: the
            # event never arriving, arriving and being refused on its signature, and arriving
            # and being accepted while the tier stayed put. `stripe listen` records the forward
            # and the response code for each event, which separates all three in one line.
            #
            # Signing secrets are redacted the same way the extraction step below redacts them.
            if [ "$status" -ne 0 ] && [ -f "$listener_log" ]; then
              echo "::group::stripe listen log"
              sed -E 's/whsec_[A-Za-z0-9_-]+/<redacted>/g' "$listener_log" >&2 || true
              echo "::endgroup::"
            fi
            kill "$listener_pid" 2>/dev/null || true
            wait "$listener_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          # Stripe CLI exposes the per-listener signing secret only in its human-readable log. Read
          # it before Playwright starts because the server must verify forwarded webhook signatures.
          webhook_secret=""
          for _ in $(seq 1 30); do
            if [ -f "$listener_log" ]; then
              webhook_secret="$(sed -nE "s/.*webhook signing secret is '?(whsec_[A-Za-z0-9_-]+)'?.*/\\1/p" "$listener_log" | head -n1)"
            fi
            if [ -n "$webhook_secret" ]; then
              break
            fi
            if ! kill -0 "$listener_pid" 2>/dev/null; then
              # The listener log is useful for diagnosing startup failures, but never expose its
              # signing secret in the Actions log.
              sed -E 's/whsec_[A-Za-z0-9_-]+/<redacted>/g' "$listener_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$webhook_secret" ]; then
            # Keep the timeout failure actionable without leaking the temporary signing secret.
            sed -E 's/whsec_[A-Za-z0-9_-]+/<redacted>/g' "$listener_log" >&2 || true
            echo "error: Stripe CLI did not provide a webhook signing secret" >&2
            exit 1
          fi

          printf '::add-mask::%s\n' "$webhook_secret"
          export STRIPE_WEBHOOK_SECRET="$webhook_secret"
          npm run e2e -- --config=playwright.stripe.config.ts

      - name: Confirm the webhook was actually delivered
        id: webhook_delivered
        if: always()
        env:
          LISTENER_LOG: ${{ runner.temp }}/stripe-listen.log
        run: |
          set -euo pipefail
          # The entitlement assertion in the spec can fail for three unrelated reasons, and they
          # look identical from the test: the event never arrived, it arrived and was refused on
          # its signature, or it arrived and was accepted while the tier stayed put. This says
          # which, in the run that failed, instead of leaving it to be guessed at afterwards.
          if [ ! -f "$LISTENER_LOG" ]; then
            echo "no listener log; the forwarder never started" >&2
            exit 0
          fi
          if ! grep -q "checkout.session.completed" "$LISTENER_LOG"; then
            echo "the checkout.session.completed event was never forwarded to the server" >&2
          elif grep -qE "\[(4|5)[0-9][0-9]\]" "$LISTENER_LOG"; then
            echo "the event was forwarded and the server refused it:" >&2
            grep -E "\[(4|5)[0-9][0-9]\]" "$LISTENER_LOG" >&2 || true
          else
            echo "the event was forwarded and accepted, so a failing tier is not a webhook problem"
          fi

      - name: Reject skipped Stripe smoke tests
        id: not_skipped
        working-directory: web
        run: |
          set -euo pipefail
          # The JSON report is retained so this credentialed run cannot pass by silently skipping
          # the only real-Stripe test.
          node -e 'const report = require("./test-results/stripe-playwright.json"); const expected = report.stats?.expected ?? 0; const skipped = report.stats?.skipped ?? 0; if (expected < 1 || skipped !== 0) { console.error(`Stripe smoke expected at least one test and no skips (expected=${expected}, skipped=${skipped})`); process.exit(1); }'

      - name: Clean up smoke subscriptions
        if: always()
        working-directory: web
        run: |
          set -euo pipefail
          fixture="e2e/.fixture.json"
          if [ ! -f "$fixture" ]; then
            exit 0
          fi
          org_id="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("e2e/.fixture.json", "utf8")).org_id)')"
          subscriptions_file="$RUNNER_TEMP/stripe-subscriptions.json"
          matches_file="$RUNNER_TEMP/stripe-subscription-matches.tsv"
          : > "$matches_file"
          starting_after=""

          # Search Stripe metadata as well as Postgres: a webhook can fail after Checkout creates a
          # subscription but before the server stores its id. The subscription metadata is written
          # by StripeBilling from the seeded org id, so this remains bounded to this smoke run.
          # Follow every API page so a reused test organisation cannot leave a match beyond the
          # first 100 records.
          while :; do
            if [ -n "$starting_after" ]; then
              curl --fail --silent --show-error --user "$STRIPE_API_KEY:" \
                --get "https://api.stripe.com/v1/subscriptions" \
                --data-urlencode "status=all" \
                --data-urlencode "limit=100" \
                --data-urlencode "starting_after=$starting_after" \
                --output "$subscriptions_file"
            else
              curl --fail --silent --show-error --user "$STRIPE_API_KEY:" \
                --get "https://api.stripe.com/v1/subscriptions" \
                --data-urlencode "status=all" \
                --data-urlencode "limit=100" \
                --output "$subscriptions_file"
            fi

            node - "$org_id" "$subscriptions_file" "$matches_file" <<'NODE'
          const fs = require("node:fs");
          const [orgId, file, matchesFile] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          for (const subscription of payload.data ?? []) {
            if (subscription.status === "canceled") continue;
            const subscriptionOrg = subscription.metadata?.org_id ?? "";
            if (subscriptionOrg === orgId) {
              fs.appendFileSync(matchesFile, `${subscription.id}\n`);
            }
          }
          NODE

            has_more="$(node - "$subscriptions_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          process.stdout.write(payload.has_more ? "true" : "false");
          NODE
            )"
            [ "$has_more" = "true" ] || break
            starting_after="$(node - "$subscriptions_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          process.stdout.write(payload.data?.at(-1)?.id ?? "");
          NODE
            )"
            [ -n "$starting_after" ] || break
          done

          cleanup_failed=0
          while read -r subscription_id; do
            [ -n "$subscription_id" ] || continue
            if ! curl --fail --silent --show-error --user "$STRIPE_API_KEY:" \
              --request DELETE "https://api.stripe.com/v1/subscriptions/$subscription_id" \
              >/dev/null; then
              echo "warning: could not cancel Stripe subscription $subscription_id" >&2
              cleanup_failed=1
            fi
          done < "$matches_file"
          # The restricted test key deliberately has Customers read but not write access.
          # Keep generated customers as the billing contract requires; only subscriptions are
          # cancelled by this cleanup.
          if [ "$cleanup_failed" -ne 0 ]; then
            echo "error: one or more Stripe cleanup requests failed" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stripe-smoke-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      # Only on a schedule. A dispatched run has somebody watching it by definition, and during
      # the five rounds of debugging that produced this workflow's current shape every failed
      # attempt would have commented here. Alert fatigue is how an alert stops working.
      - name: Open or update the alert
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does check out, so gh could resolve the repository from the remote. Set
          # explicitly anyway: a later change that drops the checkout would otherwise take this
          # step with it under set -e and disable the alert without failing anything.
          GH_REPO: ${{ github.repository }}
          TITLE: "Stripe billing smoke is failing"
          LABEL: billing-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # `failure()` fires for anything in the job, and most of the job is not billing: eleven
          # setup and build steps run before the first Stripe call, and the cleanup afterwards can
          # fail on its own. Telling somebody a wasm-pack download was a billing regression is the
          # alert fatigue this workflow is meant to avoid, so the three steps that actually
          # exercise checkout are identified and the body says which kind of failure this was.
          BILLING_FAILED: ${{ steps.checkout_flow.outcome == 'failure' || steps.webhook_delivered.outcome == 'failure' || steps.not_skipped.outcome == 'failure' }}
        run: |
          set -euo pipefail
          # Identified by label rather than title, for the same reason as the backup alert: title
          # search is token-based and would adopt a human issue that happens to mention Stripe.
          gh label create "$LABEL" --force \
            --color B60205 --description "Raised automatically when the Stripe smoke test fails"

          existing="$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')"
          if [ "${BILLING_FAILED:-}" = "true" ]; then
            what='A step that exercises real checkout failed, so this is either a regression in billing or drift in the Stripe account that this repository did not cause.'
          else
            what='The checkout steps themselves did not fail. Something around them did, which is setup, a build, or the cleanup afterwards, so read the log before concluding anything about billing.'
          fi
          body="$(printf 'The weekly Stripe smoke test failed in [this run](%s).\n\n%s\n\nThe Playwright report is uploaded as an artefact when the run got far enough to produce one. The webhook listener log is not: it is printed into the job log instead, because the redaction of its signing secret happens on the way to stderr and the file itself still contains the secret.' "$RUN_URL" "$what")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi

      # Closed on any success, including a dispatched one, which is the asymmetry with the step
      # above and is deliberate: fixing a failure and dispatching a run to confirm it is exactly
      # the moment the alert should clear, and waiting until Tuesday to clear it would leave an
      # issue standing that describes a problem already solved.
      - name: Close a resolved alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: billing-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Every open alert, not just the newest: taking only the first would leave any earlier
          # duplicate open for ever, claiming an outage that ended.
          # One call, not a comment followed by a close. Two calls mean two timeline entries and
          # two notifications for a single piece of good news, and this PR's whole argument is
          # that an alert people learn to skim is an alert that has stopped working.
          #
          # No guard against the label not existing, deliberately, though the sibling carries one.
          # `gh issue list --label` returns an empty list and exits 0 for a label that was never
          # created, and bash does not apply errexit to a failed substitution in a `for` word
          # list, so both halves of the feared failure are absent. A genuine API error still
          # leaves the loop empty and the alert open, which is the safe direction.
          for number in $(gh issue list --state open --label "$LABEL" --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Passing again as of [this run]($RUN_URL)."
          done
