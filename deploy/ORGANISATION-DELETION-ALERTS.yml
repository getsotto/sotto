# Starter Prometheus rules for the protected organisation-deletion exporter.
# Load these rules only when the scrape target is configured; tune notification routing per fleet.
# Prometheus is the default format; adapt the expressions to another monitoring system as needed.
#
# You do not need Prometheus for three of these five. `scripts/check-deletion-metrics` implements
# SottoOrganisationDeletionFailed, SottoOrganisationDeletionPurgeDue and
# SottoOrganisationDeletionBillingStuck from a single scrape, because the server computes those
# conditions in SQL and exports them as gauges: deciding them needs no history and no query
# engine. `.github/workflows/deletion-alerts.yml` runs it six-hourly and raises a labelled issue.
#
# The other two, SottoOrganisationDeletionWorkerRaces and SottoOrganisationDeletionPurgeFailed,
# are deliberately not implemented there, and for one shared reason: both read `increase(...)`
# over an hour, which is the change in a monotonic counter, and deciding that needs the previous
# reading kept somewhere between runs. A single scrape cannot answer either.
#
# WorkerRaces additionally needs a threshold nobody can yet choose. `> 3` reclaimed leases or
# rejected compare-and-sets per hour was written before any deletion had ever been requested, and
# an alert nobody can calibrate is one that gets ignored. PurgeFailed has no such problem: its
# threshold is `> 0`, because any failed purge matters. It is held back only by the history.
#
# Implement them when a deployment has the throughput to tune the first and somewhere to keep a
# previous reading for both, or load this file into Prometheus if you already run one.

groups:
  - name: sotto-organisation-deletion
    rules:
      - alert: SottoOrganisationDeletionFailed
        expr: sotto_organisation_deletion_operations{state="failed"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Organisation deletion has failed
          description: A deletion operation is waiting for an owner or operator action.

      - alert: SottoOrganisationDeletionBillingStuck
        expr: sotto_organisation_deletion_oldest_age_seconds{state="cancelling_billing"} > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Organisation deletion billing cancellation is stuck
          description: Billing cancellation has remained in progress for more than 24 hours.

      - alert: SottoOrganisationDeletionPurgeDue
        expr: sotto_organisation_deletion_purge_due_count > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Organisation deletion is due for purge but has not advanced
          description: A retention operation has passed its deadline without entering purging.

      - alert: SottoOrganisationDeletionWorkerRaces
        expr: >-
          sum(increase(sotto_organisation_deletion_attempts_total{metric="lease_expiries", outcome="reclaimed"}[1h]))
          + sum(increase(sotto_organisation_deletion_attempts_total{metric="stale_compare_and_set", outcome="rejected"}[1h])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Organisation deletion workers are losing repeated races
          description: Lease recovery or stale compare-and-set rejections are rising.

      - alert: SottoOrganisationDeletionPurgeFailed
        expr: >-
          increase(sotto_organisation_deletion_attempts_total{metric="purge_attempts", outcome="failed"}[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Organisation deletion purge failed
          description: A purge failed closed and requires the recovery runbook.
