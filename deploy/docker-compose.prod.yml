# Sotto - production deployment: Postgres + API server + Caddy (web app, HTTPS) in one command.
#
#   cd deploy
#   cp .env.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# That pulls prebuilt multi-arch images from GHCR (published by .github/workflows/images.yml), so
# the box never compiles anything - a 1 GB VM is enough. To build from source instead (e.g. to
# deploy unreleased changes), use `up -d --build`. Pin a version with SOTTO_IMAGE_TAG=vX.Y.Z.
#
# See deploy/README.md for the full runbook (DNS, GitHub OAuth app, backups, upgrades).
#
# Topology: only Caddy is exposed (80/443). It serves the web app and reverse-proxies the API,
# so everything lives on ONE origin (session cookie + CSP stay same-origin). Postgres and the
# server are reachable only on the internal compose network.

name: sotto

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: sotto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sotto"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/getsotto/sotto-server:${SOTTO_IMAGE_TAG:-latest}
    build:
      context: ..
      args:
        SOTTO_BUILD_SHA: ${SOTTO_BUILD_SHA:-}
    restart: unless-stopped
    environment:
      # The password is interpolated into a URL - keep it URL-safe (see .env.example).
      DATABASE_URL: postgres://sotto:${POSTGRES_PASSWORD}@postgres:5432/sotto
      SOTTO_PUBLIC_URL: https://${SOTTO_DOMAIN:?set SOTTO_DOMAIN in deploy/.env}
      SOTTO_WEB_ORIGIN: https://${SOTTO_DOMAIN}
      # Deployment identity is explicit and independent of Stripe configuration. Keep this as
      # self_hosted for customer-operated deployments; the operated Sotto service sets cloud.
      SOTTO_DEPLOYMENT_MODE: ${SOTTO_DEPLOYMENT_MODE:-self_hosted}
      # Human hosted action enforcement is a deliberate rollout switch; keep it shadow-only by
      # default until the Cloud transition and export gates are approved.
      SOTTO_CLOUD_ACTION_ENFORCEMENT: ${SOTTO_CLOUD_ACTION_ENFORCEMENT:-0}
      SOTTO_CLOUD_RETENTION_DRY_RUN_ENABLED: ${SOTTO_CLOUD_RETENTION_DRY_RUN_ENABLED:-0}
      SOTTO_CLOUD_SHARED_RETENTION_DRY_RUN_ENABLED: ${SOTTO_CLOUD_SHARED_RETENTION_DRY_RUN_ENABLED:-0}
      SOTTO_CLOUD_RETENTION_OPERATOR_TOKEN: ${SOTTO_CLOUD_RETENTION_OPERATOR_TOKEN:-}
      SOTTO_CLOUD_RETENTION_PURGE_ENABLED: ${SOTTO_CLOUD_RETENTION_PURGE_ENABLED:-0}
      SOTTO_CLOUD_RETENTION_DESTRUCTIVE_TOKEN: ${SOTTO_CLOUD_RETENTION_DESTRUCTIVE_TOKEN:-}
      SOTTO_CLOUD_RETENTION_EVIDENCE_HMAC_KEY: ${SOTTO_CLOUD_RETENTION_EVIDENCE_HMAC_KEY:-}
      SOTTO_CLOUD_RETENTION_BUILD_SHA: ${SOTTO_CLOUD_RETENTION_BUILD_SHA:-}
      # New Cloud subscriptions stay unavailable until the full lifecycle and public terms are
      # approved. This does not disable customer management or verified webhook processing.
      SOTTO_CLOUD_SALES_ENABLED: ${SOTTO_CLOUD_SALES_ENABLED:-0}
      SOTTO_FOUNDING_SCHEDULE_WORKER_ENABLED: ${SOTTO_FOUNDING_SCHEDULE_WORKER_ENABLED:-0}
      SOTTO_FOUNDING_SCHEDULE_PREFLIGHT_VERIFIED: ${SOTTO_FOUNDING_SCHEDULE_PREFLIGHT_VERIFIED:-0}
      SOTTO_FOUNDING_PRICE_NOTICES_ENABLED: ${SOTTO_FOUNDING_PRICE_NOTICES_ENABLED:-0}
      SOTTO_CLOUD_CONTACT_ENROLMENT_ENABLED: ${SOTTO_CLOUD_CONTACT_ENROLMENT_ENABLED:-0}
      SOTTO_CLOUD_CONTACT_EMAIL_SEND_ENABLED: ${SOTTO_CLOUD_CONTACT_EMAIL_SEND_ENABLED:-0}
      SOTTO_CLOUD_CONTACT_EMAIL_FROM: ${SOTTO_CLOUD_CONTACT_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SOTTO_CLOUD_NOTICE_DISPATCH_ENABLED: ${SOTTO_CLOUD_NOTICE_DISPATCH_ENABLED:-0}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # Recovers only persisted Stripe operations with their original request identity.
      SOTTO_BILLING_RECOVERY_WORKER_ENABLED: ${SOTTO_BILLING_RECOVERY_WORKER_ENABLED:-0}
      SOTTO_SPONSORED_BILLING_RECOVERY_WORKER_ENABLED: ${SOTTO_SPONSORED_BILLING_RECOVERY_WORKER_ENABLED:-0}
      # Keep payer-transfer routes unavailable until provider execution and recovery are verified.
      SOTTO_BILLING_TRANSFERS_ENABLED: ${SOTTO_BILLING_TRANSFERS_ENABLED:-0}
      SOTTO_BILLING_TRANSFER_EXECUTION_ENABLED: ${SOTTO_BILLING_TRANSFER_EXECUTION_ENABLED:-0}
      SOTTO_BILLING_TRANSFER_SETUP_ENABLED: ${SOTTO_BILLING_TRANSFER_SETUP_ENABLED:-0}
      # Machine eligibility enforcement remains dormant until the hosted CI policy is approved.
      SOTTO_MACHINE_ELIGIBILITY_ENFORCEMENT: ${SOTTO_MACHINE_ELIGIBILITY_ENFORCEMENT:-0}
      SOTTO_PROVIDER_REFRESH_INGEST_ENABLED: ${SOTTO_PROVIDER_REFRESH_INGEST_ENABLED:-0}
      SOTTO_PROVIDER_REFRESH_WORKER_ENABLED: ${SOTTO_PROVIDER_REFRESH_WORKER_ENABLED:-0}
      SOTTO_PROVIDER_REFRESH_RECONCILIATION_ENABLED: ${SOTTO_PROVIDER_REFRESH_RECONCILIATION_ENABLED:-0}
      SOTTO_PROVIDER_AUTHORITY_REVALIDATION_ENABLED: ${SOTTO_PROVIDER_AUTHORITY_REVALIDATION_ENABLED:-0}
      SOTTO_CLOUD_COVERAGE_AUTHORITY_MAX_AGE_SECONDS: ${SOTTO_CLOUD_COVERAGE_AUTHORITY_MAX_AGE_SECONDS:-}
      SOTTO_CLOUD_COVERAGE_AUTHORITY_SHADOW: ${SOTTO_CLOUD_COVERAGE_AUTHORITY_SHADOW:-0}
      SOTTO_CLOUD_COVERAGE_AUTHORITY_ENFORCEMENT: ${SOTTO_CLOUD_COVERAGE_AUTHORITY_ENFORCEMENT:-0}
      # Optional: without these the server still boots (health + migrations), but login and every
      # authenticated endpoint return 503. Fill them in for a usable instance.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Optional Stripe billing: dark (503) until all three are set. See deploy/README.md.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_ACCOUNT_ID: ${STRIPE_ACCOUNT_ID:-}
      STRIPE_STANDARD_MONTHLY_PRICE_ID: ${STRIPE_STANDARD_MONTHLY_PRICE_ID:-}
      STRIPE_STANDARD_ANNUAL_PRICE_ID: ${STRIPE_STANDARD_ANNUAL_PRICE_ID:-}
      STRIPE_FOUNDING_MONTHLY_PRICE_ID: ${STRIPE_FOUNDING_MONTHLY_PRICE_ID:-}
      STRIPE_FOUNDING_ANNUAL_PRICE_ID: ${STRIPE_FOUNDING_ANNUAL_PRICE_ID:-}
      STRIPE_CLOUD_PORTAL_CONFIGURATION_ID: ${STRIPE_CLOUD_PORTAL_CONFIGURATION_ID:-}
      SOTTO_SPONSORED_BILLING_ENABLED: ${SOTTO_SPONSORED_BILLING_ENABLED:-0}
      SOTTO_BILLING_CORRECTIONS_ENABLED: ${SOTTO_BILLING_CORRECTIONS_ENABLED:-0}
      SOTTO_BILLING_OPERATOR_TOKEN: ${SOTTO_BILLING_OPERATOR_TOKEN:-}
      # The separate payer-transfer review token is optional; without it, /ops transfer routes are
      # not registered. Keep it unset until manual transfer recovery is staffed.
      SOTTO_BILLING_TRANSFER_OPERATOR_TOKEN: ${SOTTO_BILLING_TRANSFER_OPERATOR_TOKEN:-}
      # Anonymous daily version ping (random instance uuid + version + os/arch, nothing else -
      # README §Telemetry). On by default; set SOTTO_TELEMETRY=off in deploy/.env to opt out.
      SOTTO_TELEMETRY: ${SOTTO_TELEMETRY:-}
      # Landing-page GitHub stats. Dark (503, no outbound GitHub) unless set to 1.
      SOTTO_COMMUNITY: ${SOTTO_COMMUNITY:-}
      # Recovery window for new requests, 1-365 days; match it to backup/export retention. Existing
      # operations keep their stored deadline. The organisation stays frozen for the whole window.
      # Use '-' rather than ':-' so an explicitly empty value reaches server validation.
      SOTTO_ORGANISATION_DELETION_RETENTION_DAYS: ${SOTTO_ORGANISATION_DELETION_RETENTION_DAYS-30}
      # Keep the worker off until the final enablement checklist is complete; only "1" starts it.
      # Use ':-' rather than '-' so an explicitly empty value stays disabled.
      SOTTO_ORGANISATION_DELETION_WORKER_ENABLED: ${SOTTO_ORGANISATION_DELETION_WORKER_ENABLED:-0}
      # Keep the exporter dark until a metrics scraper is configured; never put this bearer token in logs.
      SOTTO_ORGANISATION_DELETION_METRICS_TOKEN: ${SOTTO_ORGANISATION_DELETION_METRICS_TOKEN:-}
      # Aggregate Cloud lifecycle diagnostics; use a read-only credential distinct from every operator token.
      SOTTO_CLOUD_OPERATIONS_METRICS_TOKEN: ${SOTTO_CLOUD_OPERATIONS_METRICS_TOKEN:-}
      # Provider-backed coverage repair is a separate write capability; keep it unset until its runbook is ready.
      SOTTO_CLOUD_COVERAGE_REPAIR_TOKEN: ${SOTTO_CLOUD_COVERAGE_REPAIR_TOKEN:-}
      # Keep operator observations behind a separate bearer token; leave blank until the runbook is ready.
      SOTTO_ORGANISATION_DELETION_OPERATOR_TOKEN: ${SOTTO_ORGANISATION_DELETION_OPERATOR_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: ghcr.io/getsotto/sotto-web:${SOTTO_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # The client flag is compiled into the SPA; keep it off until the final enablement PR.
        VITE_ORGANISATION_DELETION_ENABLED: ${VITE_ORGANISATION_DELETION_ENABLED:-false}
        # Staged pricing copy is hidden until the offer and terms are approved for publication.
        VITE_CLOUD_PRICING_VISIBLE: ${VITE_CLOUD_PRICING_VISIBLE:-false}
        # Baked into the SPA's crawler-facing metadata at build time, so the box
        # declares its own canonical address rather than the hosted site's.
        SOTTO_PUBLIC_URL: https://${SOTTO_DOMAIN:?set SOTTO_DOMAIN in deploy/.env}
    restart: unless-stopped
    environment:
      SOTTO_DOMAIN: ${SOTTO_DOMAIN}
      SOTTO_API: server:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Persist certificates and Caddy state across restarts (avoids re-issuing on every deploy).
      - caddy_data:/data
      - caddy_config:/config
      # JSON access logs (rotated by Caddy - see the Caddyfile's log block).
      - caddy_logs:/var/log/caddy
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
